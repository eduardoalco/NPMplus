name: Build Caddy Docker Image
on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/caddy.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  pull_request:
    paths:
      - .github/workflows/caddy.yml
      - caddy/Dockerfile
      - caddy/Caddyfile
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository_owner == 'eduardoalco' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: eduardoalco
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: cloud
          endpoint: eduardoalco/build
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: caddy
          platforms: linux/amd64,linux/arm64
          tags: eduardoalco/npmplus:caddy
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
