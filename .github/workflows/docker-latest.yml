name: Build Latest Docker Image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "name of the release"
        required: true
        type: string
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository_owner == 'eduardoalco' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            flags: -march=x86-64-v2 -mtune=generic -fcf-protection=full
          - platform: linux/arm64
            suffix: arm64
            flags: -mbranch-protection=standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: cloud
          endpoint: eduardoalco/build
      - name: Set image version
        run: |
          jq --arg v "${{ inputs.tag }}-$(git rev-parse --short HEAD)-$(cat .version)" '.version = $v' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          jq --arg v "${{ inputs.tag }}-$(git rev-parse --short HEAD)-$(cat .version)" '.version = $v' backend/package.json > backend/package.json.tmp && mv backend/package.json.tmp backend/package.json
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKER_USER }}/npmplus:latest-${{ matrix.suffix }}
          outputs: type=registry
          build-args: |
            FLAGS=${{ matrix.flags }}

  merge:
    if: ${{ github.repository_owner == 'eduardoalco' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: cloud
          endpoint: eduardoalco/build
      - name: Publish multi-platform images
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKER_USER }}/npmplus:beta \
            --tag ${{ secrets.DOCKER_USER }}/npmplus:latest \
            --tag ${{ secrets.DOCKER_USER }}/npmplus:${{ inputs.tag }} \
            --tag ${{ secrets.DOCKER_USER }}/nginx-proxy-manager:latest \
            ${{ secrets.DOCKER_USER }}/npmplus:latest-amd64 \
            ${{ secrets.DOCKER_USER }}/npmplus:latest-arm64
