name: Build Develop Docker Image
on:
  push:
    branches:
      - develop
  pull_request:
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: ${{ github.repository_owner == 'eduardoalco' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            suffix: amd64
            flags: -march=x86-64-v2 -mtune=generic -fcf-protection=full
          - platform: linux/arm64
            suffix: arm64
            flags: -mbranch-protection=standard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: cloud
          endpoint: eduardoalco/build
      - name: Set image version
        run: |
          jq --arg v "$(git rev-parse --short HEAD)" '.version = $v' frontend/package.json > frontend/package.json.tmp && mv frontend/package.json.tmp frontend/package.json
          jq --arg v "$(git rev-parse --short HEAD)" '.version = $v' backend/package.json > backend/package.json.tmp && mv backend/package.json.tmp backend/package.json
      - name: Build ${{ matrix.platform }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          tags: ${{ secrets.DOCKER_USER }}/npmplus:develop-${{ matrix.suffix }}
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
          build-args: |
            FLAGS=${{ matrix.flags }}

  merge:
    if: ${{ github.repository_owner == 'eduardoalco' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: build
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PAT }}
      - name: Set up Docker Build Cloud
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: cloud
          endpoint: eduardoalco/build
      - name: Publish multi-platform image
        run: |
          docker buildx imagetools create \
            --tag ${{ secrets.DOCKER_USER }}/npmplus:develop \
            ${{ vars.DOCKER_USER }}/npmplus:develop-amd64 \
            ${{ vars.DOCKER_USER }}/npmplus:develop-arm64
